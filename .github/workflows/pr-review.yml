name: PR Review

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          show_full_output: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this pull request yourself and completely. Do not start subagents
            and do not wait for anything: the run ends as soon as you answer.

            1. Read title and description with `gh pr view` and the full diff with
               `gh pr diff`. You may read files in the checkout for context.
            2. Read the project rules in `CLAUDE.md`.
            3. Only report high-confidence findings:
               - bugs: code that will definitely fail, throw or compute wrong results
               - security issues in the changed code
               - clear violations of a rule in `.ai/guidelines/` you can quote
               Do not report style, taste, guesses or issues that existed before.
            4. Verify every finding against the code again. If unsure, drop it.
            5. Post each finding as an inline comment with
               `mcp__github_inline_comment__create_inline_comment` and `confirmed: true`.
            6. Always finish with exactly one `gh pr comment`, also without findings:
               a `## Code review` heading, one sentence per finding or "No findings.",
               and one line on what you checked.
          claude_args: |
            --model opus
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),mcp__github_inline_comment__create_inline_comment"