spring:
  application:
    name: bookshelf-backend
  profiles:
    active: local
  datasource:
    url: jdbc:sqlite:data/bookshelf.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      # sqlite-jdbc does not implement getGeneratedKeys(); read the new id via last_insert_rowid() instead
      hibernate.jdbc.use_get_generated_keys: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  cors:
    # Frontend dev server origins allowed to call the API (comma-separated)
    allowed-origins: http://localhost:3000,http://localhost:5173
