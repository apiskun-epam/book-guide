spring:
  application:
    name: bookshelf-backend
  profiles:
    active: local
  autoconfigure:
    # We authenticate with session cookies only; no generated default user/password
    exclude: org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:sqlite:data/bookshelf.db
    driver-class-name: org.sqlite.JDBC
  jpa:
    database-platform: org.hibernate.community.dialect.SQLiteDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      # sqlite-jdbc does not implement getGeneratedKeys(); read the new id via last_insert_rowid() instead
      hibernate.jdbc.use_get_generated_keys: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8080
  error:
    include-message: never
    include-stacktrace: never

app:
  catalog:
    # Language of book titles/editions requested from Open Library (ISO 639-1). English only for now.
    language: en
  cors:
    # Frontend dev server origins allowed to call the API (comma-separated)
    allowed-origins: http://localhost:3000,http://localhost:5173
  auth:
    cookie-name: bookshelf_session
    session-duration: 7d
    # Set true whenever the app is served over HTTPS
    cookie-secure: false
    max-sign-in-age: 5m

firebase:
  # Project id belongs in the gitignored application-local.yml (firebase.project-id)
  service-account-path: ${FIREBASE_SERVICE_ACCOUNT_PATH:$HOME/.secrets/firebase-service-account.json}

anthropic:
  model: ${ANTHROPIC_MODEL:claude-sonnet-5-5}
  api:
    key: ${ANTHROPIC_API_KEY:}
